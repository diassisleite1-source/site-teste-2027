
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Neon Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

<header>
    <a href="index.html" class="logo">NEON<span>GAMING</span></a>

    <button class="menu-toggle"
            aria-label="Abrir menu"
            aria-expanded="false">☰</button>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="servicos.html">Serviços</a>
        <a href="projetos.html">Projetos</a>
        <a href="habilidades.html">Habilidades</a>
        <a class="active" href="contato.html">Contato</a>
    </nav>
</header>

<main>

    <section class="page-banner">
        <h1>ENTRE EM CONTATO</h1>
        <p>Vamos conversar sobre novas ideias e projetos.</p>
    </section>

    <section class="section">

        <form class="contact-form reveal"
              id="contactForm"

              <!-- COLOQUE SEU LINK DE ENVIO AQUI -->
              action="https://formsubmit.co/SEUEMAIL@gmail.com"

              method="POST">

            <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Seu nome"
                required
            >

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Seu e-mail"
                required
            >

            <textarea
                name="mensagem"
                id="mensagem"
                placeholder="Escreva sua mensagem..."
                required
            ></textarea>

            <!-- ASSUNTO DO E-MAIL -->
            <input type="hidden"
                   name="_subject"
                   value="Novo contato - Neon Gaming">

            <!-- REDIRECIONAMENTO APÓS O ENVIO -->
            <input type="hidden"
                   name="_next"
                   value="diassisleite1@gmail.com">

            <button type="submit" class="btn primary">
                ENVIAR MENSAGEM
            </button>

        </form>

    </section>

</main>

<footer>
    © <span id="year"></span> NEON GAMING —
    Todos os direitos reservados.
</footer>

</body>
</html>
