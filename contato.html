
<form class="contact-form reveal"
      action="https://formsubmit.co/SEUEMAIL@gmail.com"
      method="POST">

    <input type="text"
           name="nome"
           placeholder="Seu nome"
           required>

    <input type="email"
           name="email"
           placeholder="Seu e-mail"
           required>

    <textarea name="mensagem"
              placeholder="Escreva sua mensagem..."
              required></textarea>

    <input type="hidden" name="_subject"
           value="Nova mensagem pelo site Neon Gaming">

    <input type="hidden" name="_template"
           value="table">

    <input type="hidden" name="_captcha"
           value="true">

    <button type="submit" class="btn primary">
        ENVIAR MENSAGEM
    </button>

</form>
